<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор творческих идей</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf0;--surface:#fff;--ink:#14213d;--muted:#5d6b82;--accent:#2b59ff;--on-accent:#fff;--line:#c9d1da}
@media (prefers-color-scheme:dark){:root{--bg:#0f1523;--surface:#1a2236;--ink:#eef2fb;--muted:#9aa7c0;--accent:#7f9bff;--on-accent:#0f1523;--line:#2c3856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:28px 20px 48px}
h1{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:1rem;margin:0 0 28px;color:var(--muted)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
@media(max-width:720px){.stage{grid-template-columns:1fr;gap:24px}}
.card{background:var(--surface);padding:12px 12px 14px;border-radius:4px;box-shadow:0 14px 40px rgba(20,33,61,.18);transform:rotate(-2deg);transition:transform .3s}
.card.flip{transform:rotate(2deg)}
.photo{min-height:260px;max-height:70vh;background:var(--line);border-radius:2px;overflow:hidden;display:grid;place-items:center}
.photo img{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block}
.photo span{color:var(--muted);padding:20px;text-align:center;font-size:.95rem}
.src{margin:10px 2px 0;font-size:.85rem;color:var(--muted);min-height:1.3em}
.src a{color:var(--muted)}
.words{display:flex;flex-direction:column;gap:6px}
.w{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,5.5vw,3.4rem);line-height:1.1;margin:0;overflow-wrap:anywhere}
.w.a{color:var(--accent)}
.go{margin-top:24px;align-self:flex-start;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:14px 28px;font:inherit;font-weight:500;font-size:1.05rem;cursor:pointer}
.go[disabled]{opacity:.6;cursor:wait}
.go:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.opts{margin-top:44px;border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:16px}
label{font-size:.92rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
summary{cursor:pointer;font-size:.92rem;color:var(--muted)}
textarea{width:100%;min-height:150px;margin-top:10px;font:.82rem/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ghost{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.msg{font-size:.88rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Генератор творческих идей</h1>
  <section class="stage">
    <div>
      <div class="card" id="card"><div class="photo" id="photo"><span>Нажмите «Новая идея»</span></div></div>
      <p class="src" id="src"></p>
    </div>
    <div class="words">
      <p class="w a" id="adj">…</p>
      <p class="w" id="noun">…</p>
      <button class="go" id="go" type="button">Новая идея</button>
    </div>
  </section>

  <section class="opts">
    <label>Редкость слов
      <select id="rare">
        <option value="0">Любые</option>
        <option value="0.35" selected>Необычные</option>
        <option value="0.7">Редкие</option>
      </select>
    </label>
    <details>
      <summary>Каналы Are.na (<span id="cnt">0</span>)</summary>
      <textarea id="chs" spellcheck="false" aria-label="Ссылки на каналы Are.na, по одной в строке"></textarea>
      <div class="row">
        <button class="ghost" id="save" type="button">Сохранить</button>
        <button class="ghost" id="reset" type="button">Вернуть исходные</button>
        <span class="msg" id="msg"></span>
      </div>
    </details>
  </section>
</main>

        if(!m.total)continue;
        var pages=Math.max(1,Math.ceil(m.total/PER)),page=1+rnd(pages);
        var j=await getJSON(["https://api.are.na/v3/channels/"+slug+"/contents?per="+PER+"&page="+page,"https://api.are.na/v2/channels/"+slug+"/contents?per="+PER+"&page="+page]);
        var items=j.data||j.contents||[];
        var p=pickImage(items);
        if(p)return {url:p.url,block:p.it.id,channel:slug,title:m.title};
      }catch(e){console.warn("канал",slug,e);if(tries===3)throw e}
    }
    throw new Error("в выбранных каналах не нашлось картинок");
  }

  /* ---------- показ ---------- */
  async function roll(){
    var btn=$("go");btn.disabled=true;
    var w=words();$("adj").textContent=w.adj;$("noun").textContent=w.noun;
    flip=!flip;$("card").classList.toggle("flip",flip);
    try{
      var r=await randomImage();
      var im=new Image();im.alt="Случайная картинка для вдохновения";
      await new Promise(function(res,rej){im.onload=res;im.onerror=function(){rej(new Error("картинка не загрузилась"))};im.src=r.url});
      var ph=$("photo");ph.innerHTML="";ph.appendChild(im);
      var s=$("src");s.textContent="";
      var a=document.createElement("a");a.href=r.block?"https://www.are.na/block/"+r.block:"https://www.are.na/"+r.channel;a.target="_blank";a.rel="noopener";a.textContent="Открыть блок в Are.na";
      var c=document.createElement("a");c.href="https://www.are.na/"+r.channel;c.target="_blank";c.rel="noopener";c.textContent=r.title;
      s.appendChild(a);s.appendChild(document.createTextNode(" · канал «"));s.appendChild(c);s.appendChild(document.createTextNode("»"));
    }catch(e){
      $("photo").innerHTML="";var sp=document.createElement("span");sp.textContent="Картинку получить не удалось ("+e.message+"). Слова всё равно работают — нажмите ещё раз или проверьте каналы ниже.";$("photo").appendChild(sp);$("src").textContent="";
    }
    btn.disabled=false;
  }

  /* ---------- настройки каналов ---------- */
  function refresh(){var t=getChannels();$("chs").value=t;$("cnt").textContent=channelList().length}
  $("save").onclick=function(){
    try{localStorage.setItem(KEY,$("chs").value)}catch(e){}
    meta={};refresh();$("msg").textContent="Сохранено";setTimeout(function(){$("msg").textContent=""},1800);
  };
  $("reset").onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}meta={};refresh()};
  $("go").onclick=roll;
  refresh();roll();
})();
</script>
</body>
